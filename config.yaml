# UDRS Configuration

# Image Paths (used if batch_csv is null)
images:
  original: "data/diff/images/314_source.png"
  style: "data/style/Curly_Single.png"
  edited: "data/diff/images/314_edit_qwen-ft.png"

# Pipeline Settings
settings:
  batch_csv: "triplets_201.csv"    # Path to triplets.csv for batch mode, or null for single mode
  output_csv: "batch_results.csv" # Path to save batch evaluation results
  plot: false        # Generate Tier 1 pentagon plot (single mode only)
  use_mask: true     # Enable isolated spatial segmentation (v2.2)
  save_masks: true  # Save mask overlays for debugging independently

# Weighted Aggregation (Sum should ideally be 1.0)
weights:
  tier1_structural: 0.3
  tier2_perceptual: 0.3
  tier3_semantic: 0.2
  tier4_style: 0.2
