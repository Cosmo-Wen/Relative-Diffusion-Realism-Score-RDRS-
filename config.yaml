# UDRS Configuration

# Image Paths (used if batch_csv is null)
images:
  original: "data/original/source.png"
  style: "data/original/source.png"
  edited: "data/edited/edited.png"

# Pipeline Settings
settings:
  batch_csv: null    # Path to triplets.csv for batch mode, or null for single mode
  plot: true         # Generate Tier 1 pentagon plot (single mode only)
  use_mask: true     # Enable isolated spatial segmentation (v2.2)

# Weighted Aggregation (Sum should ideally be 1.0)
weights:
  tier1_structural: 0.3
  tier2_perceptual: 0.3
  tier3_semantic: 0.2
  tier4_style: 0.2
